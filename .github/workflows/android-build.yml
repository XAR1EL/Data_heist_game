name: Build Android APK via Capacitor

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Modern Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Set up Android SDK Baseline
      uses: android-actions/setup-android@v3

    # Force install the matching build tools inside the runner container
    - name: Ensure Build Tools Presence
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.2"

    - name: Compile and Sync Assets
      run: |
        cd data-heist-slot
        npm install
        npm run build
        npx cap sync

    - name: Compile Unsigned APK via Gradle
      run: |
        cd data-heist-slot/android
        ./gradlew assembleRelease

    - name: Automatically Optimize and Sign APK
      run: | 
       cd data-heist-slot/android/app/build/outputs/apk/release/
        # We add the explicit path prefix ($ANDROID_HOME/build-tools/33.0.2/) so the system can find them
        $ANDROID_HOME/build-tools/33.0.2/zipalign -v 4 app-release-unsigned.apk data-heist-aligned.apk
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        $ANDROID_HOME/build-tools/33.0.2/apksigner sign --ks debug.keystore --ks-pass pass:android --out data-heist-playable.apk data-heist-aligned.apk

    - name: Upload Playable Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: data-heist-playable-apk
        path: data-heist-slot/android/app/build/outputs/apk/release/data-heist-playable.apk
