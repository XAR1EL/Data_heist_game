name: Build Android APK from Local Assets

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Global Cordova
      run: npm install -g cordova@12.0.0

    - name: Prepare Cordova Workspace and Fix Module Type Clash
      run: |
        cd data-heist-slot
        # Strip out the module type rule temporarily so Cordova can parse the project files
        sed -i 's/"type": "module",//g' package.json
        
        # Clean out old failed directory remnants
        rm -rf platforms/
        rm -rf plugins/
        
        # Build out clean native Android architecture layers
        cordova platform add android@12.0.0 --no-telemetry
        
    - name: Compile APK
      run: |
        cd data-heist-slot
        cordova build android --release --no-telemetry

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: data-heist-slot-local-apk
        path: data-heist-slot/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
