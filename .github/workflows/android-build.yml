name: Build Android APK from Local Assets

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Prepare Cordova Android Platform
      run: cordova platform add android --no-telemetry
        
    - name: Compile APK
      run: cordova build android --release --no-telemetry

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: data-heist-slot-local-apk
        path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
