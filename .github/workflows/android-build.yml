name: Build Android APK via Capacitor

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Modern Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        # Bumped to match modern Capacitor compilation targets
        java-version: '21'

    - name: Set up Android SDK Baseline
      uses: android-actions/setup-android@v3

    - name: Compile and Sync Assets
      run: |
        cd data-heist-slot
        npm install
        npm run build
        npx cap sync

    - name: Compile APK via Gradle
      run: |
        cd data-heist-slot/android
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: data-heist-slot-apk
        path: data-heist-slot/android/app/build/outputs/apk/release/app-release-unsigned.apk
