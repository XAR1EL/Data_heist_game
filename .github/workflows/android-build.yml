name: Build Android APK from Local Assets

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x

    # Install Java 11 first so it's cached on the system path
    - name: Pre-cache Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    # Set system default to Java 17 so the SDK installer is happy
    - name: Set up System Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.6'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Global Cordova
      run: npm install -g cordova@12.0.0

    - name: Bypass Module Type Clash & Prepare Workspace
      run: |
        cd data-heist-slot
        sed -i 's/"type": "module",//g' package.json
        rm -rf platforms/
        rm -rf plugins/
        cordova platform add android@12.0.0 --no-telemetry
        
    - name: Compile APK (Targeting Java 11)
      run: |
        cd data-heist-slot
        # Point Cordova specifically to the Java 11 installation path to build perfectly
        export CORDOVA_JAVA_HOME=$JAVA_HOME_11_X64
        cordova build android --release --no-telemetry

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: data-heist-slot-local-apk
        path: data-heist-slot/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
